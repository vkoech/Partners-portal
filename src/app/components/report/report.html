<div class="new-payment-request-container">
  <app-sidebar [sidebarType]="'finance'" [(open)]="sidebarOpen"></app-sidebar>

  <div class="main-content">
    <app-header
      title="Customer Statement Report"
      subtitle="Finance Services/Payment Request"
      headerClass="finance"
      [showBackButton]="true"
      [(sidebarOpen)]="sidebarOpen">
    </app-header>
    <div class="new-payment-request-content">
     <div class="new-payment-request-section card-effect">
       <div class="section-header">
        <h2>Customer Statement</h2>
       </div>
     <div class="new-payment-request-content">
      <form [formGroup]="reportForm">
         <div class="form-section">
          <div class="form-row">
          <div class="form-group">
            <label>Start Date</label>
            <input type="date" formControlName="startDate">
          </div>
           <div class="form-group">
            <label>End Date</label>
            <input type="date" formControlName="endDate">
          </div>
        </div>
        <button
          class="download-btn" (click)="downloadStatement()" [disabled]="loading">
          {{ loading ? 'Generating statement...' : 'Download Statement' }}
        </button>
        </div>
       </form>
    </div>
     </div>
      </div>
   </div>
   </div>
