<div class="login-container">
  <!-- Left Side - Logo -->
  <div class="logo-section">
    <div class="logo-container">
      <img src="assets/logo.svg" alt="InSupplyHealth Logo" class="logo" />
    </div>
  </div>

  <!-- Right Side - Login Form -->
  <div class="form-section">
    <div class="form-container">
      <h1 class="welcome-title">Welcome Back</h1>
      <p class="welcome-subtitle">Enter your email and password to sign in</p>

      <form [formGroup]="LoginForm" (submit)="onLogin()" class="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" formControlName="emailAddress" placeholder="Your email address" class="form-input" required>
        </div>
          <div class="password-wrapper">
           <div class="form-group">
            <label class="form-label">Password</label>
            <input [type]="hide ? 'password' : 'text'" class="form-input"
                formControlName="password" placeholder="Your Password"/>
              <button
                type="button" class="toggle-btn" (click)="togglePassword()"
                [attr.aria-label]="hide ? 'Show password' : 'Hide password'">
                {{ hide ? 'show' : 'hide' }}
              </button>
            </div>
          </div>
        <button type="submit" class="login-button">
          {{ loading ? 'Logging In...' : 'LOG IN' }}</button>
        <div class="forgot-password">
          Forgot Password?
          <a (click)="goToReset()" class="reset-link">Reset</a>
          <span class="separator">|Don't have account?</span>
          <a (click)="goToRegister($event)" class="register-link">Register</a>
        </div>
      </form>
    </div>
  </div>
</div>
