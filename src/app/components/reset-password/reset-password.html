<div class="login-container">
  <div class="form-section">
    <div class="form-container">
      <h1 class="welcome-title">Reset Password </h1>
      <form [formGroup]="ResetPasswordForm" (submit)="onReset()" class="login-form">
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" formControlName="pasword"  placeholder="New password" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
           <input type="password" class="form-input" formControlName="registrationNumber" placeholder="Confirm password">
        </div>
        <button type="submit" class="login-button">RESET PASSWORD</button>
      </form>
    </div>
  </div>
</div>
