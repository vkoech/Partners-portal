<div class="new-payment-request-container">
  <app-sidebar [sidebarType]="'finance'" [(open)]="sidebarOpen"></app-sidebar>

  <div class="main-content">
    <app-header
      title="Cash Surrender"
      subtitle="Finance Services/Payment Request"
      headerClass="finance"
      [showBackButton]="true"
      [(sidebarOpen)]="sidebarOpen">
    </app-header>
    <div class="new-payment-request-content">
     <div class="new-payment-request-section card-effect">
       <div class="section-header">
        <h2>Cash Surrender</h2>
       </div>
    <div class="new-payment-request-content">
    <form [formGroup]="surrenderForm">
      <div class="form-section">
         <div class="form-row">
         <div class="form-group">
           <label>No</label>
            <input type="text" formControlName="no" readonly>
          </div>
          </div>
        <div class="form-row">
          <div class="form-group">
           <label>Select Cash Request: *</label>
            <select formControlName="paymentRequestNo" (change)="cashRequest()">
                <option value="" [selected]="true" disabled>Select</option>
                @for (cash of cash_list; track cash.paymentRequestNo) {
                  <option [value]="cash.paymentRequestNo">
                    {{ cash.description }}
                  </option>
                }
              </select>
          </div>
          <div class="form-group">
              <label>Currency</label>
              <input type="text" formControlName="currencyCode" readonly>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Disbursed Amount:</label>
              <input type="text" formControlName="disbursedAmount" readonly>
            </div>
          <div class="form-group">
            <label>Surrendered Amount:</label>
             <input type="text" formControlName="surrenderedAmount">
          </div>
          </div>
        <div class="form-row">
          <div class="form-group">
            <label>Description:</label>
              <textarea formControlName="description"></textarea>
          </div>
        </div>
        </div>
     </form>
    </div>
  @if(showModal)
  {
    <div class="custom-modal-backdrop">
    <div class="custom-modal">
      <h3>Cash Surender</h3>
        <form [formGroup]="surrenderLineForm">
          <div class="modal-row">
            <div class="form-field">
             <label>Category</label>
               <input formControlName="category">
            </div>
            </div>
           <div class="modal-row">
             <div class="form-field">
                <label>Amount Received</label>
               <input formControlName="amountAdvanced">
              </div>
             <div class="form-field">
               <label>Currency</label>
               <input formControlName="currencyCode">
            </div>
          </div>
           <div class="modal-row">
             <div class="form-field">
               <label>Amount Spent</label>
               <input formControlName="actualSpent">
            </div>
            </div>
          <div class="modal-row">
            <div class="form-field full-width">
              <label>Description</label>
              <textarea formControlName="description"></textarea>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button"  class="submit" (click)="submitLine()">Update</button>
            <button type="button" class="submit" (click)="closeCustomModal()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  }

      <table class="request-line-table">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Amount Received</th>
                  <th>Amount Spent</th>
                  <th>Description</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody>
               @for(row of paymentApplicationLines; track row)
                 {
                <tr>
                  <td>{{row.category}}</td>
                  <td>{{row.amountAdvanced}}</td>
                  <td>{{row.actualSpent}}</td>
                  <td>{{row.description}}</td>
                  <td>
                   <button type="button" class="edit-btn" (click)="editRequest(row)">
                      <img src="assets/edit.svg" alt="Edit" width="16" height="16" />
                      Edit
                   </button>
                  </td>
                </tr>
              }
              </tbody>
            </table>
              <div class="section-footer">
            <input type="checkbox" (change)="onCheckboxChange($event)" />
            <span>I confirm that the provided information is accurate.</span>
            <button class="submit"
                    (click)="onSubmitPaymentHeader()"
                    [disabled]="!isConfirmed">
              @if(loading)
              {
                <span class="spinner"></span>}
              Submit
            </button>
            <button class="submit" (click)="onCancel()">Close</button>
          </div>
              <app-footer></app-footer>
            </div>
    </div>
    </div>
